<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="100%" height="100%">
  <defs>
    <linearGradient id="pill-freelance" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.25)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.25)" />
    </linearGradient>

    <linearGradient id="pill-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <style>
      .nav-pill {
        transition: all 0.3s ease;
        cursor: pointer;
      }
      .nav-text {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #E2E8F0;
        letter-spacing: 0.2px;
      }
      .primary-text {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #FBBF24;
        letter-spacing: 0.3px;
      }
    </style>
  </defs>

  <g transform="translate(60, 14)">
    <!-- Pill 1: Freelance Portfolio (PRIMARY HIGHLIGHT) -->
    <g class="nav-pill" transform="translate(0, 0)">
      <rect width="175" height="42" rx="21" fill="url(#pill-freelance)" stroke="#F59E0B" stroke-width="1.5" />
      <!-- Star/Sparkle Icon -->
      <path d="M 22 17 L 24 21 L 28 22 L 24 24 L 22 28 L 20 24 L 16 22 L 20 21 Z" fill="#F59E0B" />
      <text x="36" y="26" class="primary-text">Freelance Work</text>
    </g>

    <!-- Pill 2: Student Portfolio -->
    <g class="nav-pill" transform="translate(190, 0)">
      <rect width="155" height="42" rx="21" fill="url(#pill-glass)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />
      <!-- Globe Icon -->
      <path d="M 24 21 A 7 7 0 1 0 24 20.99 Z M 17 21 H 31 M 24 14 A 10 7 0 0 0 24 28 A 10 7 0 0 0 24 14" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" />
      <text x="40" y="26" class="nav-text">Student Site</text>
    </g>

    <!-- Pill 3: LinkedIn -->
    <g class="nav-pill" transform="translate(360, 0)">
      <rect width="125" height="42" rx="21" fill="url(#pill-glass)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />
      <!-- LinkedIn Icon -->
      <path d="M 23 16 A 1.5 1.5 0 1 0 23 15.99 Z M 21 20 V 27 M 27 20 V 27 M 27 23.5 C 27 21 31 21 31 23.5 V 27" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="44" y="26" class="nav-text">LinkedIn</text>
    </g>

    <!-- Pill 4: Resume -->
    <g class="nav-pill" transform="translate(495, 0)">
      <rect width="120" height="42" rx="21" fill="url(#pill-glass)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />
      <!-- Document Icon -->
      <path d="M 22 15 H 28 L 32 19 V 27 C 32 28 31 29 30 29 H 22 C 21 29 20 28 20 27 V 17 C 20 16 21 15 22 15 Z M 28 15 V 19 H 32" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="44" y="26" class="nav-text">Resume</text>
    </g>

    <!-- Pill 5: Email -->
    <g class="nav-pill" transform="translate(630, 0)">
      <rect width="145" height="42" rx="21" fill="url(#pill-glass)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />
      <!-- Mail Icon -->
      <rect x="20" y="16" width="16" height="12" rx="2" fill="none" stroke="#10B981" stroke-width="1.5" />
      <path d="M 20 18 L 28 23 L 36 18" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" />
      <text x="44" y="26" class="nav-text">Contact Email</text>
    </g>
  </g>
</svg>
