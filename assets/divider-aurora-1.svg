<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" height="100%">
  <defs>
    <linearGradient id="div-line-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="25%" stop-color="rgba(16, 185, 129, 0.2)" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="rgba(16, 185, 129, 0.2)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <filter id="div-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .divider-pulse {
        animation: pulseLight 4s ease-in-out infinite alternate;
      }
      @keyframes pulseLight {
        0% { opacity: 0.5; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <g transform="translate(0, 30)">
    <!-- Base Subtle Line -->
    <line x1="50" y1="0" x2="850" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    
    <!-- Glowing Aurora Accent Line -->
    <line x1="150" y1="0" x2="750" y2="0" stroke="url(#div-line-1)" stroke-width="1.5" filter="url(#div-glow)" class="divider-pulse" />

    <!-- Center Emblem / Diamond -->
    <g transform="translate(450, 0)">
      <polygon points="0,-6 6,0 0,6 -6,0" fill="#07090C" stroke="#F59E0B" stroke-width="1.5" />
      <circle cx="0" cy="0" r="1.5" fill="#10B981" />
    </g>
  </g>
</svg>
