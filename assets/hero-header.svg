<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="subtitle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <style>
      .hero-name {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.8px;
        fill: url(#title-grad);
      }
      .hero-title {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        fill: url(#subtitle-grad);
      }
      .hero-quote {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #94A3B8;
        letter-spacing: -0.2px;
      }
      .quote-highlight {
        fill: #E2E8F0;
        font-weight: 500;
      }
      .glow-dot {
        animation: pulseGlow 3s ease-in-out infinite alternate;
      }
      @keyframes pulseGlow {
        0% { opacity: 0.4; transform: scale(1); }
        100% { opacity: 1; transform: scale(1.3); }
      }
    </style>
  </defs>

  <g transform="translate(450, 45)" text-anchor="middle">
    <!-- Large Name -->
    <text y="15" class="hero-name">S Haries Hussain</text>

    <!-- Subtitle / Role -->
    <text y="58" class="hero-title">CS Student • Freelance Web Developer • Full-Stack</text>

    <!-- Decorative Accent Line -->
    <g transform="translate(-120, 78)">
      <line x1="0" y1="0" x2="240" y2="0" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <circle cx="120" cy="0" r="3" fill="#F59E0B" class="glow-dot" />
    </g>

    <!-- Philosophy -->
    <text y="114" class="hero-quote">
      "Crafting high-performance web applications with <tspan class="quote-highlight">modern code</tspan> &amp; sleek design."
    </text>
  </g>
</svg>
