<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1219" />
      <stop offset="100%" stop-color="#07090C" />
    </linearGradient>

    <linearGradient id="ring-grad-bot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <style>
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: #34D399;
        letter-spacing: 0.8px;
      }
    </style>
  </defs>

  <rect width="900" height="80" rx="20" fill="url(#bg-grad-bot)" />

  <!-- Glowing Bottom Border Bar -->
  <line x1="160" y1="2" x2="740" y2="2" stroke="url(#ring-grad-bot)" stroke-width="3" stroke-linecap="round" />

  <!-- Status Pill Badge (Centered at x=450, y=36) -->
  <g transform="translate(330, 18)">
    <rect width="240" height="38" rx="19" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.2" />
    <circle cx="24" cy="19" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="23" class="pill-text">AVAILABLE FOR FREELANCE</text>
  </g>
</svg>
