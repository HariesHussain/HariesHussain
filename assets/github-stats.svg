<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="metric-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(18, 22, 30, 0.9)" />
      <stop offset="100%" stop-color="rgba(9, 11, 16, 0.95)" />
    </linearGradient>

    <linearGradient id="bar-react" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61DAFB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="bar-ts" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178C6" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <style>
      .stat-num {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
        font-size: 32px;
        font-weight: 800;
        fill: #F8FAFC;
        letter-spacing: -0.5px;
      }
      .stat-label {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #94A3B8;
        letter-spacing: 0.5px;
      }
      .lang-name {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #E2E8F0;
      }
    </style>
  </defs>

  <g transform="translate(30, 0)">
    <!-- CARD 1: OVERVIEW METRICS (Width 410) -->
    <g transform="translate(0, 0)">
      <rect width="410" height="190" rx="16" fill="url(#metric-card-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
      
      <!-- Metric 1: Total Contributions -->
      <g transform="translate(30, 40)">
        <text class="stat-num" fill="#10B981">390+</text>
        <text y="24" class="stat-label">TOTAL CONTRIBUTIONS</text>
      </g>

      <!-- Metric 2: Primary Focus -->
      <g transform="translate(230, 40)">
        <text class="stat-num" fill="#F59E0B">100%</text>
        <text y="24" class="stat-label">COMMIT COMMITMENT</text>
      </g>

      <!-- Subtitle Details -->
      <g transform="translate(30, 140)">
        <circle cx="6" cy="-4" r="4" fill="#10B981" />
        <text x="18" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#94A3B8">Active GitHub Contributor &amp; Freelance Developer</text>
      </g>
    </g>

    <!-- CARD 2: TOP TECHNOLOGIES (Width 410) -->
    <g transform="translate(430, 0)">
      <rect width="410" height="190" rx="16" fill="url(#metric-card-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
      
      <g transform="translate(25, 25)">
        <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="13" font-weight="700" fill="#F59E0B" letter-spacing="1">PRIMARY TECH STACK DISTRIBUTION</text>
      </g>

      <!-- Progress Bars -->
      <g transform="translate(25, 60)">
        <!-- React / Next.js -->
        <text x="0" y="0" class="lang-name">TypeScript / React / Next.js</text>
        <text x="320" y="0" class="lang-name" font-weight="700" fill="#34D399">55%</text>
        <rect x="0" y="10" width="360" height="8" rx="4" fill="rgba(255,255,255,0.06)" />
        <rect x="0" y="10" width="200" height="8" rx="4" fill="url(#bar-react)" />

        <!-- JavaScript / HTML / CSS -->
        <text x="0" y="45" class="lang-name">JavaScript &amp; Modern Web API</text>
        <text x="320" y="45" class="lang-name" font-weight="700" fill="#FBBF24">30%</text>
        <rect x="0" y="55" width="360" height="8" rx="4" fill="rgba(255,255,255,0.06)" />
        <rect x="0" y="55" width="110" height="8" rx="4" fill="url(#bar-ts)" />
      </g>
    </g>
  </g>
</svg>
