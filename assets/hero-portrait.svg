<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%">
  <defs>
    <!-- Dark Atmospheric Base Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090C" />
      <stop offset="50%" stop-color="#0E1219" />
      <stop offset="100%" stop-color="#07090C" />
    </linearGradient>

    <!-- Moving Aurora Mesh Gradient -->
    <linearGradient id="aurora-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25">
        <animate attributeName="stop-color" values="#10B981;#D97706;#059669;#10B981" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.2">
        <animate attributeName="stop-color" values="#D97706;#059669;#10B981;#D97706" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.25">
        <animate attributeName="stop-color" values="#059669;#10B981;#D97706;#059669" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Gold to Emerald Ring Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Clip Path for 3:2 Photo Aspect Ratio -->
    <clipPath id="photo-clip">
      <rect x="160" y="25" width="580" height="340" rx="20" />
    </clipPath>

    <!-- Radial Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="heavy-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <style>
      .floating-particle {
        animation: floatParticle 8s ease-in-out infinite alternate;
      }
      .floating-particle-2 {
        animation: floatParticle2 10s ease-in-out infinite alternate;
      }
      .breathing-frame {
        animation: breathe 6s ease-in-out infinite alternate;
        transform-origin: 450px 195px;
      }
      .shimmer-sweep {
        animation: sweep 7s ease-in-out infinite;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #34D399;
        letter-spacing: 0.8px;
      }

      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { transform: translateY(-25px) translateX(20px); opacity: 0.2; }
      }
      @keyframes floatParticle2 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { opacity: 0.7; }
        100% { transform: translateY(20px) translateX(-20px); opacity: 0.3; }
      }
      @keyframes breathe {
        0% { transform: scale(0.99); }
        100% { transform: scale(1.01); }
      }
      @keyframes sweep {
        0% { transform: translateX(-300px); opacity: 0; }
        50% { opacity: 0.25; }
        100% { transform: translateX(300px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Base Container -->
  <rect width="900" height="460" rx="24" fill="url(#bg-grad)" stroke="#1E2330" stroke-width="1.5" />

  <!-- Aurora Backdrop -->
  <ellipse cx="450" cy="195" rx="380" ry="170" fill="url(#aurora-grad)" filter="url(#heavy-blur)" />

  <!-- Floating Particles -->
  <circle cx="100" cy="90" r="2.5" fill="#F59E0B" class="floating-particle" />
  <circle cx="800" cy="120" r="2" fill="#10B981" class="floating-particle-2" />
  <circle cx="90" cy="340" r="2" fill="#34D399" class="floating-particle" />
  <circle cx="810" cy="320" r="2.5" fill="#FBBF24" class="floating-particle-2" />

  <!-- Outer Glow Filter behind Photo Frame -->
  <rect x="154" y="19" width="592" height="352" rx="24" fill="none" stroke="url(#ring-grad)" stroke-width="3" filter="url(#glow)" opacity="0.8" />

  <!-- MAIN PHOTO FRAME GROUP -->
  <g class="breathing-frame">
    
    <!-- Photo Image (Raw GitHub URL for Camo Proxy Compatibility + Local Fallback) -->
    <g clip-path="url(#photo-clip)">
      <image href="https://raw.githubusercontent.com/HariesHussain/HariesHussain/main/assets/profile-photo.jpg" x="160" y="25" width="580" height="340" preserveAspectRatio="xMidYMid slice" opacity="0.98" />
      
      <!-- Subtle Glass Shimmer Reflection Over Photo -->
      <polygon points="160,25 320,25 220,365 160,365" fill="rgba(255,255,255,0.06)" class="shimmer-sweep" />
    </g>

    <!-- Glassmorphic Border Frame around Photo -->
    <rect x="160" y="25" width="580" height="340" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <rect x="158" y="23" width="584" height="344" rx="22" fill="none" stroke="url(#ring-grad)" stroke-width="2" />
  </g>

  <!-- Status Pill Badge below Photo Frame (PERFECT VERTICAL ALIGNMENT & PADDING) -->
  <g transform="translate(330, 392)">
    <rect width="240" height="38" rx="19" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.2" />
    <circle cx="24" cy="19" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="23" class="pill-text">AVAILABLE FOR FREELANCE</text>
  </g>
</svg>
