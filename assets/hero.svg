<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">S Haries Hussain</title>
  <desc id="d">Computer Science Student. Web developer, learning and building.</desc>
  <style>
    :root { --ink:#1f2328; --muted:#59636e; --rule:#8c959f; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e6edf3; --muted:#9198a1; --rule:#6e7681; }
    }
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; text-anchor: middle; }
    .name  { font-size: 38px; font-weight: 600; fill: var(--ink); letter-spacing: 0.3px; }
    .role  { font-size: 19px; font-weight: 400; fill: var(--ink); }
    .line  { font-size: 15px; font-weight: 400; fill: var(--muted); }
    .rule  { stroke: var(--rule); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; }
    .a { opacity: 0; animation: rise 0.9s ease-out forwards; }
    .a1 { animation-delay: 0.15s; }
    .a2 { animation-delay: 0.65s; }
    .a3 { animation-delay: 1.15s; }
    .r  { transform: scaleX(0); animation: grow 0.9s ease-out 0.45s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; opacity: 1; }
      .r { animation: none; transform: scaleX(1); }
    }
  </style>
  <text class="name a a1" x="400" y="52">S Haries Hussain</text>
  <line class="rule r" x1="360" y1="76" x2="440" y2="76"/>
  <text class="role a a2" x="400" y="108">Computer Science Student</text>
  <text class="line a a3" x="400" y="136">Web developer. Learning and building.</text>
</svg>
