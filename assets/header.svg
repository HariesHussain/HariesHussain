<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Name and role" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sheen" x1="0" x2="1">
      <stop offset="0" stop-color="#B59B6B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#B59B6B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#B59B6B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="300" rx="14" fill="#0F1613"/>
  <rect x="14" y="14" width="972" height="272" rx="8" fill="none" stroke="#B59B6B" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="2488" stroke-dashoffset="2488">
    <animate attributeName="stroke-dashoffset" from="2488" to="0" dur="2.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="500" y="92" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="7" fill="#B59B6B" opacity="0">
    SOFTWARE ENGINEER
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1.2s" fill="freeze"/>
  </text>
  <text x="500" y="152" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="52" font-weight="500" letter-spacing="12" fill="#EDE6D6" opacity="0">
    HARIES HUSSAIN
    <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="1.4s" fill="freeze"/>
  </text>
  <line x1="500" y1="178" x2="500" y2="178" stroke="#B59B6B" stroke-width="1">
    <animate attributeName="x1" from="500" to="440" begin="1.8s" dur="1s" fill="freeze"/>
    <animate attributeName="x2" from="500" to="560" begin="1.8s" dur="1s" fill="freeze"/>
  </line>
  <g font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#8FA396" text-anchor="middle">
    <text x="500" y="222" opacity="0">Backend and full stack engineering
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="2.6s" repeatCount="indefinite"/></text>
    <text x="500" y="222" opacity="0">Applied machine learning and computer vision
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.63;0.68;1" dur="9s" begin="2.6s" repeatCount="indefinite"/></text>
    <text x="500" y="222" opacity="0">Considered, well-crafted software
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.71;0.96;1" dur="9s" begin="2.6s" repeatCount="indefinite"/></text>
  </g>
  <rect x="-200" y="262" width="200" height="1.5" fill="url(#sheen)">
    <animate attributeName="x" from="-200" to="1000" dur="6s" begin="3s" repeatCount="indefinite"/>
  </rect>
</svg>