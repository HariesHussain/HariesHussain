<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <linearGradient id="skill-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(18, 22, 30, 0.85)" />
      <stop offset="100%" stop-color="rgba(10, 13, 18, 0.95)" />
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.12)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.12)" />
    </linearGradient>

    <style>
      .skill-cat-title {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #F8FAFC;
        letter-spacing: -0.2px;
      }
      .skill-pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #E2E8F0;
      }
      .skill-card {
        transition: all 0.3s ease;
      }
      .skill-card:hover rect {
        stroke: rgba(16, 185, 129, 0.4);
      }
    </style>
  </defs>

  <g transform="translate(0, 0)">
    <!-- SECTION HEADER -->
    <g transform="translate(30, 25)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#F59E0B" text-transform="uppercase">CAPABILITIES &amp; ARCHITECTURE</text>
      <text y="30" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="26" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5px">Technical Stack &amp; Tools</text>
    </g>

    <!-- GRID ROW 1: 3 CARDS -->

    <!-- CARD 1: LANGUAGES (Removed C++) -->
    <g class="skill-card" transform="translate(30, 80)">
      <rect width="270" height="200" rx="14" fill="url(#skill-card-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
      <g transform="translate(20, 20)">
        <circle cx="14" cy="14" r="14" fill="rgba(245, 158, 11, 0.15)" />
        <path d="M 10 10 L 6 14 L 10 18 M 18 10 L 22 14 L 18 18 M 15 8 L 13 20" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round" fill="none" />
        <text x="38" y="19" class="skill-cat-title">Languages</text>
      </g>
      <!-- Pills -->
      <g transform="translate(20, 65)">
        <!-- TypeScript -->
        <rect x="0" y="0" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="14" cy="16" r="3" fill="#3178C6" />
        <text x="24" y="20" class="skill-pill-text">TypeScript</text>

        <!-- JavaScript -->
        <rect x="115" y="0" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="129" cy="16" r="3" fill="#F7DF1E" />
        <text x="139" y="20" class="skill-pill-text">JavaScript</text>

        <!-- HTML5 & CSS3 -->
        <rect x="0" y="42" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="14" cy="58" r="3" fill="#E34F26" />
        <text x="24" y="62" class="skill-pill-text">HTML5 / CSS3</text>

        <!-- SQL -->
        <rect x="115" y="42" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="129" cy="58" r="3" fill="#10B981" />
        <text x="139" y="62" class="skill-pill-text">SQL</text>
      </g>
    </g>

    <!-- CARD 2: FRONTEND -->
    <g class="skill-card" transform="translate(315, 80)">
      <rect width="270" height="200" rx="14" fill="url(#skill-card-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
      <g transform="translate(20, 20)">
        <circle cx="14" cy="14" r="14" fill="rgba(16, 185, 129, 0.15)" />
        <path d="M 14 7 L 22 11 L 14 15 L 6 11 Z M 6 15 L 14 19 L 22 15 M 6 19 L 14 23 L 22 19" stroke="#10B981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="38" y="19" class="skill-cat-title">Frontend</text>
      </g>
      <g transform="translate(20, 65)">
        <rect x="0" y="0" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="14" cy="16" r="3" fill="#61DAFB" />
        <text x="24" y="20" class="skill-pill-text">React.js</text>

        <rect x="115" y="0" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="129" cy="16" r="3" fill="#FFFFFF" />
        <text x="139" y="20" class="skill-pill-text">Next.js</text>

        <rect x="0" y="42" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="14" cy="58" r="3" fill="#06B6D4" />
        <text x="24" y="62" class="skill-pill-text">Tailwind CSS</text>

        <rect x="115" y="42" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="129" cy="58" r="3" fill="#646CFF" />
        <text x="139" y="62" class="skill-pill-text">Vite</text>
      </g>
    </g>

    <!-- CARD 3: BACKEND & DATABASE -->
    <g class="skill-card" transform="translate(600, 80)">
      <rect width="270" height="200" rx="14" fill="url(#skill-card-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
      <g transform="translate(20, 20)">
        <circle cx="14" cy="14" r="14" fill="rgba(245, 158, 11, 0.15)" />
        <ellipse cx="14" cy="10" rx="8" ry="3" fill="none" stroke="#F59E0B" stroke-width="1.5" />
        <path d="M 6 10 V 15 C 6 17 10 18 14 18 C 18 18 22 17 22 15 V 10 M 6 15 V 20 C 6 22 10 23 14 23 C 18 23 22 22 22 20 V 15" fill="none" stroke="#F59E0B" stroke-width="1.5" />
        <text x="38" y="19" class="skill-cat-title">Backend &amp; DB</text>
      </g>
      <g transform="translate(20, 65)">
        <rect x="0" y="0" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="14" cy="16" r="3" fill="#339933" />
        <text x="24" y="20" class="skill-pill-text">Node.js</text>

        <rect x="115" y="0" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="129" cy="16" r="3" fill="#3ECF8E" />
        <text x="139" y="20" class="skill-pill-text">Supabase</text>

        <rect x="0" y="42" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="14" cy="58" r="3" fill="#FFCA28" />
        <text x="24" y="62" class="skill-pill-text">Firebase</text>

        <rect x="115" y="42" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="129" cy="58" r="3" fill="#FD366E" />
        <text x="139" y="62" class="skill-pill-text">Appwrite</text>
      </g>
    </g>

    <!-- GRID ROW 2: 3 CARDS -->

    <!-- CARD 4: CLOUD & DEPLOYMENT -->
    <g class="skill-card" transform="translate(30, 295)">
      <rect width="270" height="200" rx="14" fill="url(#skill-card-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
      <g transform="translate(20, 20)">
        <circle cx="14" cy="14" r="14" fill="rgba(16, 185, 129, 0.15)" />
        <path d="M 8 18 C 6 18 5 16 6 14 C 7 12 9 11 11 12 C 12 9 16 9 18 11 C 21 11 22 13 21 15 C 23 16 22 18 20 18 Z" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round" fill="none" />
