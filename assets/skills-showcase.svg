        <circle cx="14" cy="16" r="3" fill="#FFFFFF" />
        <text x="24" y="20" class="skill-pill-text">Vercel</text>

        <rect x="115" y="0" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="129" cy="16" r="3" fill="#F05032" />
        <text x="139" y="20" class="skill-pill-text">Git &amp; GitHub</text>

        <rect x="0" y="42" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="14" cy="58" r="3" fill="#F59E0B" />
        <text x="24" y="62" class="skill-pill-text">Serverless</text>

        <rect x="115" y="42" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="129" cy="58" r="3" fill="#2496ED" />
        <text x="139" y="62" class="skill-pill-text">Docker</text>
      </g>
    </g>

    <!-- CARD 5: TOOLS & WORKFLOW (Removed Figma, Postman) -->
    <g class="skill-card" transform="translate(315, 295)">
      <rect width="270" height="200" rx="14" fill="url(#skill-card-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
      <g transform="translate(20, 20)">
        <circle cx="14" cy="14" r="14" fill="rgba(245, 158, 11, 0.15)" />
        <path d="M 9 9 C 9 6 12 6 12 9 C 12 12 9 12 9 9 Z M 16 9 C 16 6 19 6 19 9 Z M 9 16 C 9 13 12 13 12 16 Z M 16 16 C 16 13 19 13 19 16 Z" stroke="#F59E0B" stroke-width="1.5" fill="none" />
        <text x="38" y="19" class="skill-cat-title">Developer Tools</text>
      </g>
      <g transform="translate(20, 65)">
        <rect x="0" y="0" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="14" cy="16" r="3" fill="#007ACC" />
        <text x="24" y="20" class="skill-pill-text">VS Code</text>

        <rect x="115" y="0" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="129" cy="16" r="3" fill="#CB3837" />
        <text x="139" y="20" class="skill-pill-text">npm / pnpm</text>

        <rect x="0" y="42" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="14" cy="58" r="3" fill="#10B981" />
        <text x="24" y="62" class="skill-pill-text">REST Client</text>

        <rect x="115" y="42" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="129" cy="58" r="3" fill="#F59E0B" />
        <text x="139" y="62" class="skill-pill-text">Chrome Dev</text>
      </g>
    </g>

    <!-- CARD 6: ARTIFICIAL INTELLIGENCE -->
    <g class="skill-card" transform="translate(600, 295)">
      <rect width="270" height="200" rx="14" fill="url(#skill-card-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
      <g transform="translate(20, 20)">
        <circle cx="14" cy="14" r="14" fill="rgba(16, 185, 129, 0.15)" />
        <path d="M 14 6 L 16 11 L 21 14 L 16 17 L 14 22 L 12 17 L 7 14 L 12 11 Z" stroke="#10B981" stroke-width="1.5" fill="none" />
        <text x="38" y="19" class="skill-cat-title">AI &amp; Automation</text>
      </g>
      <g transform="translate(20, 65)">
        <rect x="0" y="0" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="14" cy="16" r="3" fill="#4285F4" />
        <text x="24" y="20" class="skill-pill-text">Gemini API</text>

        <rect x="115" y="0" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="129" cy="16" r="3" fill="#10A37F" />
        <text x="139" y="20" class="skill-pill-text">OpenAI SDK</text>

        <rect x="0" y="42" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="14" cy="58" r="3" fill="#F59E0B" />
        <text x="24" y="62" class="skill-pill-text">AI Tooling</text>

        <rect x="115" y="42" width="105" height="32" rx="8" fill="url(#badge-glow)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="129" cy="58" r="3" fill="#34D399" />
        <text x="139" y="62" class="skill-pill-text">Prompt Eng</text>
